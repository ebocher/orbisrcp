name: CI deploy

# Only the master branch publishes the p2 repository
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Push to the p2-repository branch (served by GitHub Pages: https://orbisgis.github.io/orbisrcp/)
    permissions:
      contents: write
    steps:

      # DBeaver and its dependencies must be cloned side by side (see dbeaver/AGENTS.md)
      - name: Checkout DBeaver common
        uses: actions/checkout@v5
        with:
          repository: dbeaver/dbeaver-common
          path: dbeaver-common

      - name: Checkout Datadam API
        uses: actions/checkout@v5
        with:
          repository: dbeaver/datadam-api
          path: datadam-api

      - name: Checkout DBeaver
        uses: actions/checkout@v5
        with:
          repository: dbeaver/dbeaver
          path: dbeaver

      # After the checkouts: the Maven cache key is computed from the pom.xml files
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and install DBeaver
        run: mvn -B install -f dbeaver/product/aggregate/pom.xml -T1C -DskipTests

      - name: Checkout OrbisRCP sources
        uses: actions/checkout@v5
        with:
          path: orbisrcp

      - name: Build OrbisRCP
        run: mvn -B clean verify -f orbisrcp/pom.xml

      - name: Checkout the p2 branch
        uses: actions/checkout@v5
        with:
          ref: p2-repository
          path: p2-repository

      # Configure git user in order to sign release with OrbisGIS user.
      - name: Configure Git User
        working-directory: p2-repository
        run: |
          git config user.email "info@orbisgis.org"
          git config user.name OrbisGIS

      # The new build replaces the previous one: the old plugins would stay in the branch forever, unused
      # (the p2 metadata only lists the new build)
      - name: Update the p2 repository
        working-directory: p2-repository
        run: |
          git rm -rq --ignore-unmatch features plugins artifacts.jar content.jar artifacts.xml.xz content.xml.xz \
            p2.index index.html web
          unzip -o -qq ../orbisrcp/p2/target/p2-1.0.0-SNAPSHOT.zip -d ./
          sed -e "s/@DATE@/$(date -u '+%Y-%m-%d %H:%M UTC')/" -e "s/@COMMIT@/${GITHUB_SHA::7}/" \
            ../orbisrcp/p2/siteTemplate/index.html > index.html

      - name: Push P2 branch
        working-directory: p2-repository
        run: |
          git add -A
          git commit -m "Update P2 repo." || echo "Nothing to commit"
          git push origin p2-repository
