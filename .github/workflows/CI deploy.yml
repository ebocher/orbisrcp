name: CI deploy

# Only the master branch publishes the p2 repository
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # DBeaver and its dependencies must be cloned side by side (see dbeaver/AGENTS.md)
      - name: Checkout DBeaver common
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver-common
          path: dbeaver-common

      - name: Checkout Datadam API
        uses: actions/checkout@v4
        with:
          repository: dbeaver/datadam-api
          path: datadam-api

      - name: Checkout DBeaver
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver
          path: dbeaver

      - name: Build and install DBeaver
        run: mvn -B install -f dbeaver/product/aggregate/pom.xml -T1C -DskipTests

      - name: Checkout OrbisRCP sources
        uses: actions/checkout@v4
        with:
          path: orbisrcp

      - name: Build OrbisRCP
        run: mvn -B clean verify -f orbisrcp/pom.xml

      - name: Checkout the p2 branch
        uses: actions/checkout@v4
        with:
          ref: p2-repository
          path: p2-repository

      # Configure git user in order to sign release with OrbisGIS user.
      - name: Configure Git User
        working-directory: p2-repository
        run: |
          git config user.email "info@orbisgis.org"
          git config user.name OrbisGIS

      - name: Update the p2 repository
        working-directory: p2-repository
        run: unzip -o -qq ../orbisrcp/p2/target/p2-1.0.0-SNAPSHOT.zip -d ./

      - name: Push P2 branch
        working-directory: p2-repository
        run: |
          git add -A
          git commit -m "Update P2 repo." || echo "Nothing to commit"
          git push origin p2-repository
