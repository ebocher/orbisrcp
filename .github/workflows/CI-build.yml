name: CI build

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # DBeaver and its dependencies must be cloned side by side (see dbeaver/AGENTS.md)
      - name: Checkout DBeaver common
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver-common
          path: dbeaver-common

      - name: Checkout Datadam API
        uses: actions/checkout@v4
        with:
          repository: dbeaver/datadam-api
          path: datadam-api

      - name: Checkout DBeaver
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver
          path: dbeaver

      - name: Checkout OrbisRCP
        uses: actions/checkout@v4
        with:
          path: orbisrcp

      - name: Build and install DBeaver
        run: mvn -B install -f dbeaver/product/aggregate/pom.xml -T1C -DskipTests

      - name: Build OrbisRCP
        run: mvn -B clean verify -f orbisrcp/pom.xml

      - name: Upload the p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: orbisrcp-p2
          path: orbisrcp/p2/target/repository/
